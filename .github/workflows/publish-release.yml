name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check solution
        uses: bvdcode/github-workflows/actions/dotnet-checks@v1
        with:
          project: Sources/EasyExtensions.sln
          dotnet-version: 10.0.x
          enable-raw-icmp: true

  postgres-index-tests:
    runs-on: ubuntu-latest
    env:
      SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}
      EASYEXTENSIONS_TEST_POSTGRES: Host=localhost;Port=5432;Database=index_metadata_tests;Username=postgres
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: index_metadata_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d index_metadata_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check PostgreSQL index metadata
        uses: bvdcode/github-workflows/actions/dotnet-checks@v1
        with:
          project: Sources/EasyExtensions.Tests/EasyExtensions.Tests.csproj
          dotnet-version: 10.0.x
          test-filter: FullyQualifiedName~PostgresIndexMetadata|FullyQualifiedName~PostgresHnswScan
          test-results-name: postgres-index-tests

  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, postgres-index-tests]
    uses: bvdcode/github-workflows/.github/workflows/gitversion.yml@v1

  pack:
    needs: version
    runs-on: ubuntu-latest
    env:
      SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}
    outputs:
      artifact-name: ${{ steps.pack.outputs.artifact-name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pack solution
        id: pack
        uses: bvdcode/github-workflows/actions/dotnet-pack@v1
        with:
          projects: Sources/EasyExtensions.sln
          dotnet-version: 10.0.x
          version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Publish NuGet packages
        uses: bvdcode/github-workflows/actions/nuget-publish@v1
        with:
          artifact-name: ${{ needs.pack.outputs.artifact-name }}
          version: ${{ needs.version.outputs.version }}
          authentication: oidc
          nuget-user: bvd
          github-packages-token: ${{ secrets.DEPLOY_GITHUB_TOKEN }}
          publish: true

  release:
    needs: [version, pack, publish]
    permissions:
      contents: write
    uses: bvdcode/github-workflows/.github/workflows/release.yml@v1
    with:
      version: ${{ needs.version.outputs.version }}
      artifact-name: ${{ needs.pack.outputs.artifact-name }}
